<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <script>
      /*
       * Una sola dirección para la app.
       *
       * El login de Google solo puede terminar cuando ocurre en el MISMO
       * origen que el authDomain del proyecto. Desde cualquier otra dirección
       * el paso final queda en un iframe de tercera parte: iOS Safari lo
       * bloquea (ITP) y en la PWA instalada de Android se queda colgado, que
       * es el bug que dejaba la app en "Cargando Glow Heaven…" para siempre.
       *
       * El proyecto tiene tres direcciones para la misma app (dos que Firebase
       * da solas y una que se creó a mano), así que sin esto cualquiera puede
       * instalar la "equivocada" y no poder entrar nunca.
       *
       * Va acá y no en el bundle para que ni siquiera haga falta descargarlo.
       * La lista es explícita a propósito: localhost y cualquier dominio nuevo
       * quedan intactos, y así no hay forma de armar un bucle de redirección.
       *
       * Si algún día cambia el dominio canónico, actualizar también
       * DOMINIOS_CON_LOGIN_PROPIO en src/lib/firebase-mobile.ts.
       */
      (function () {
        var canonico = 'glow-heaven-db-app.firebaseapp.com';
        var alternos = ['glow-heaven-movil.web.app', 'glow-heaven-db-app.web.app'];
        if (location.hostname !== canonico && alternos.indexOf(location.hostname) !== -1) {
          location.replace(
            'https://' + canonico + location.pathname + location.search + location.hash
          );
        }
      })();
    </script>
    <meta name="theme-color" content="#0B0A0A" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:;" />
    <meta name="description" content="Ventas rápidas y panel del negocio de Glow Heaven, desde el celular." />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Glow Heaven" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Glow Heaven Móvil</title>
  </head>
  <!-- Sin `style="background-color"` en el body: un estilo inline le gana a
       cualquier regla CSS, así que el blanco de antes se imponía sobre el
       token del tema y asomaba como una franja clara en modo oscuro. El color
       lo pone `body { background-color: rgb(var(--fondo)) }` en index.css, y
       la hoja de estilos bloquea el render, así que no hay destello. -->
  <body class="antialiased" style="margin: 0;">
    <div id="root">
      <div style="display:flex;min-height:100dvh;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
        <img src="/icons/icon-192.png" alt="Glow Heaven" style="width:80px;height:80px;border-radius:22px;box-shadow:0 8px 24px -4px rgba(5,150,105,0.18);" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
